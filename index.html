<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>RepliK — Fragancias</title>
  <meta name="description" content="Fragancias de alta calidad inspiradas en los perfumes más icónicos del mundo."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/style.css"/>
</head>

<body>

  <!-- NAV -->
  <nav class="nav" id="mainNav">
    <a class="nav-logo" href="#">
      <span class="nav-logo-text"><span>Repli</span><strong>K</strong></span>
    </a>
    <button class="nav-cart-btn" id="navCartBtn" aria-label="Ver carrito">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <span class="nav-cart-badge" id="navCartBadge">0</span>
    </button>
  </nav>

  <!-- HERO -->
  <header class="hero" style="background-image: url('/media/hero_background.webp');">
    <h1 class="hero-brand"><span>Repli</span><strong>K</strong></h1>
    <p class="hero-tagline">El lujo del perfume, sin el precio.</p>
    <div class="hero-badge">Fragancias de alta calidad &middot; 100ml</div>
  </header>

  <!-- TOOLBAR -->
  <div class="toolbar" id="catalogo">
    <div class="toolbar-inner">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input id="searchInput" type="search" placeholder="Buscar fragancia..." autocomplete="off"/>
      </div>
      <div class="filter-pills" id="filterPills">
        <button class="pill active" data-cat="all">Todos</button>
        <button class="pill" data-cat="hombre">Para Él</button>
        <button class="pill" data-cat="mujer">Para Ella</button>
      </div>
      <span class="toolbar-count" id="filterCount"></span>
    </div>
  </div>

  <!-- CATALOG -->
  <main id="catalog"></main>

  <!-- FLOATING CART -->
  <button class="cart-fab" id="cartFab" aria-label="Ver carrito">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <path d="M16 10a4 4 0 01-8 0"/>
    </svg>
    <span class="badge" id="cartBadge">0</span>
  </button>

  <!-- CART OVERLAY -->
  <div class="cart-overlay" id="cartOverlay"></div>

  <!-- CART DRAWER -->
  <aside class="cart-drawer" id="cartDrawer" aria-label="Carrito de compras">
    <div class="cart-header">
      <h2>Mi carrito</h2>
      <button class="cart-close" id="cartClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span class="cart-total-label">Total</span>
        <span class="cart-total-value" id="cartTotal">$0</span>
      </div>
      <div class="cart-total-items" id="cartItemCount">0 productos</div>
      <button class="btn-whatsapp" id="btnCheckout" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Finalizar pedido por WhatsApp
      </button>
    </div>
  </aside>

  <!-- PRODUCT MODAL -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
      <div class="modal-body">
        <!-- SLIDER -->
        <div class="slider-wrap" id="sliderWrap">
          <div class="slider-track" id="sliderTrack"></div>
          <button class="slider-btn prev" id="sliderPrev" aria-label="Anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button class="slider-btn next" id="sliderNext" aria-label="Siguiente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <div class="slider-dots" id="sliderDots"></div>
        </div>
        <!-- DETAIL -->
        <div class="modal-detail" id="modalDetail"></div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-brand">
      <span class="nav-logo-text"><span>Repli</span><strong>K</strong></span>
      <p>Fragancias de alta calidad inspiradas en los perfumes más icónicos del mundo.</p>
    </div>
    <div>
      <div class="footer-section-title">Navegación</div>
      <a href="#catalogo" class="footer-link">Catálogo</a>
      <a href="#" class="footer-link">Cómo funciona</a>
      <a href="#" class="footer-link">Contacto</a>
    </div>
    <div>
      <div class="footer-section-title">Contacto</div>
      <a href="https://wa.me/593989523236" class="footer-link" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
